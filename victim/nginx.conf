server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /admin {
        auth_basic "IIoT Admin Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location /api/status {
        add_header Content-Type application/json;
        return 200 '{"device":"iiot-edge-device","status":"running","uptime":86400}';
    }

    location /login {
        add_header Content-Type text/html;
        return 200 '<html><body><form method="POST"><input name="user"/><input name="pass" type="password"/><button>Login</button></form></body></html>';
    }
}
